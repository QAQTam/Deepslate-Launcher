[package]
name = "deepslate-core"
version = "0.1.0"
description = "Deepslate Launcher 框架无关的业务核心"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha1 = "0.11"
hex = "0.4"
scraper = "0.29"
roxmltree = "0.20"
zip = "2"
flate2 = "1"
futures = "0.3"
dirs = "6"
uuid = { version = "1.0", features = ["v4", "serde"] }
md-5 = "0.11"
url = "2.4"
ring = "0.17"
base64 = "0.22"
toml = "1.1.8"
iroh = "1.4.1"
bytes = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
