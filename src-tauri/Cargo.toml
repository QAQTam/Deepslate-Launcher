[package]
name = "obsidian-launcher"
version = "0.1.0"
description = "A Minecraft Java Edition Launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "obsidian_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
obsidian-launcher-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
open = "5"
