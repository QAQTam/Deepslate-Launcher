[package]
name = "obsidian-launcher"
version = "0.1.0"
description = "A Minecraft Java Edition Launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "obsidian_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha1 = "0.11"
hex = "0.4"
zip = "2"
indicatif = "0.18"
futures = "0.3"
dirs = "6"
uuid = { version = "1.0", features = ["v4", "serde"] }
md-5 = "0.11"
tiny_http = "0.12"
url = "2.4"
open = "5"
