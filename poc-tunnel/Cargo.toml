[package]
name = "poc-tunnel"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
tokio = { version = "1.54", features = ["full"] }
iroh = "1.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
